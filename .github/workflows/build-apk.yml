name: Build JARVIS Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract clean app source
        run: unzip -o JARVIS-app-clean.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-Mobile-V1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mobile-V1
          path: JARVIS-Mobile-V1.apk
          if-no-files-found: error

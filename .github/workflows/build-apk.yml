name: Build Signed JARVIS Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply CLEAN install fix
        run: |
          sed -i 's/applicationId = "com.kaan.jarvismobile2"/applicationId = "com.kaan.jarvismobile.clean"/' app/build.gradle.kts
          sed -i 's/applicationId = "com.kaan.jarvismobile"/applicationId = "com.kaan.jarvismobile.clean"/' app/build.gradle.kts
          sed -i 's/versionCode = 1/versionCode = 4/' app/build.gradle.kts
          sed -i 's/versionCode = 2/versionCode = 4/' app/build.gradle.kts
          sed -i 's/versionCode = 3/versionCode = 4/' app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "1.0.2"/' app/build.gradle.kts
          sed -i 's/versionName = "1.0.1"/versionName = "1.0.2"/' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Create signing keystore
        run: |
          keytool -genkeypair \
            -keystore jarvis-release.jks \
            -storepass jarvis123456 \
            -keypass jarvis123456 \
            -alias jarvis \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=JARVIS Mobile,O=Kaan,C=TR"

      - name: Locate Android build tools
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> $GITHUB_ENV

      - name: Sign APK
        run: |
          "$BUILD_TOOLS/zipalign" -f -v 4 \
            app/build/outputs/apk/debug/app-debug.apk \
            JARVIS-Mobile-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks jarvis-release.jks \
            --ks-key-alias jarvis \
            --ks-pass pass:jarvis123456 \
            --key-pass pass:jarvis123456 \
            --out JARVIS-Mobile-SIGNED.apk \
            JARVIS-Mobile-aligned.apk

      - name: Verify APK signature
        run: |
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs JARVIS-Mobile-SIGNED.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mobile-SIGNED
          path: JARVIS-Mobile-SIGNED.apk  

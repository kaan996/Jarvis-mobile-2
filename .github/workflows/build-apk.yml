name: Build JARVIS Mobile CLEAN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply CLEAN install fix
        run: |
          sed -i 's/applicationId = "com.kaan.jarvismobile2"/applicationId = "com.kaan.jarvismobile.clean"/' app/build.gradle.kts
          sed -i 's/applicationId = "com.kaan.jarvismobile"/applicationId = "com.kaan.jarvismobile.clean"/' app/build.gradle.kts
          sed -i 's/versionCode = 1/versionCode = 3/' app/build.gradle.kts
          sed -i 's/versionCode = 2/versionCode = 3/' app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "1.0.1"/' app/build.gradle.kts
          sed -i 's/android:label="JARVIS Mobile"/android:label="JARVIS Mobile Clean"/' app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-Mobile-CLEAN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mobile-CLEAN
          path: JARVIS-Mobile-CLEAN.apk
          
